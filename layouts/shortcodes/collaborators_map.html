<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
    #collab-map { height: 400px; width: 100%; border-radius: 8px; z-index: 10; margin-top: 10px; }
</style>
<div id="collab-map"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var map = L.map('collab-map').setView([-20, 100], 2);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var locations = [
          {name: "Ruth Pérez", org: "Hospital Sótero del Río", coords: [-33.58, -70.58]},
          {name: "Warren M. Grill", org: "Duke University", coords: [36.00, -78.94]},
          {name: "Pedro Chaná-Cuevas", org: "CETRAM", coords: [-33.43, -70.65]},
          {name: "Rómulo Fuentes, Andrea Slachevsky", org: "Universidad de Chile", coords: [-33.45, -70.66]},
          {name: "Max Chacón", org: "Universidad de Santiago de Chile", coords: [-33.45, -70.68]},
          {name: "Adrian Palacios, Patricio Orio", org: "CINV - Universidad de Valparaíso", coords: [-33.04, -71.62]},
          {name: "Eduardo Cerpa, Matias Courdurier,<br>Esteban Paduro, Cristóbal Rojas", org: "Pontificia Universidad Católica de Chile", coords: [-33.44, -70.61]},
          {name: "Jose Gomez-Tames", org: "Chiba University, Japan", coords: [35.61, 140.10]},
          {name: "Joaquín Araya-Arriagada", org: "Universidad Santo Tomás", coords: [-33.45, -70.66]},
          {name: "David Grayden, Pip Karoly,<br>Joel Villalobos, Joe West, Bang Bui", org: "University of Melbourne", coords: [-37.80, 144.96]},
          {name: "Monica Acosta", org: "University of Auckland", coords: [-36.85, 174.76]}
        ];

        locations.forEach(function(loc) {
            L.marker(loc.coords).addTo(map)
                .bindPopup("<b>" + loc.name + "</b><br>" + loc.org);
        });
    });
</script>
